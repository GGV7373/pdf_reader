services:
  app:
    build: .
    ports:
      # 127.0.0.1 so only this computer can open the app, not others on the network
      - "127.0.0.1:5000:5000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    # No ports: only the app container can talk to Ollama
    volumes:
      # Keeps downloaded models between restarts
      - ollama:/root/.ollama

volumes:
  ollama:
