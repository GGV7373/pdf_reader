<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Reader</title>
<!-- No outside scripts, fonts or images: nothing leaves this computer -->
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  #chat div { white-space: pre-wrap; padding: .75rem 1rem; border-radius: 8px; margin: .5rem 0; }
  .user { background: #e8f0fe; }
  .assistant { background: #f3f3f3; }
  .error { background: #fde8e8; }
  #status { color: #555; }
  form { display: flex; gap: .5rem; margin: 1rem 0; }
  input[type=text] { flex: 1; padding: .5rem; }
  button { padding: .5rem 1rem; }
</style>
</head>
<body>
<h1>PDF Reader</h1>
<p>Runs only on your computer. PDFs are never saved and are only sent to your local Ollama.</p>

<form id="upload-form">
  <label for="pdf">PDF file:</label>
  <input type="file" id="pdf" accept="application/pdf" required>
  <button>Load</button>
</form>
<p id="status" role="status">No PDF loaded.</p>

<div id="chat" aria-live="polite"></div>

<form id="ask-form">
  <label for="question" hidden>Question</label>
  <input type="text" id="question" placeholder="Ask a question about the PDF" disabled>
  <button id="ask-button" disabled>Ask</button>
</form>

<script>
let messages = null;
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const question = document.getElementById("question");
const askButton = document.getElementById("ask-button");

function addBubble(text, className) {
  const div = document.createElement("div");
  div.className = className;
  div.textContent = text;  // textContent, so PDF or model text can never run as code
  chat.appendChild(div);
  return div;
}

document.getElementById("upload-form").onsubmit = async (e) => {
  e.preventDefault();
  const file = document.getElementById("pdf").files[0];
  const form = new FormData();
  form.append("pdf", file);
  statusText.textContent = "Loading…";
  const data = await (await fetch("/upload", { method: "POST", body: form })).json();
  if (data.error) {
    statusText.textContent = data.error;
    return;
  }
  // A new PDF starts a fresh conversation
  messages = data.messages;
  chat.innerHTML = "";
  statusText.textContent = `Loaded ${file.name}. ${data.warning}`;
  question.disabled = askButton.disabled = false;
  question.focus();
};

document.getElementById("ask-form").onsubmit = async (e) => {
  e.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  question.value = "";
  question.disabled = askButton.disabled = true;
  addBubble(text, "user");
  messages.push({ role: "user", content: text });

  // Show the answer word by word as it arrives
  const bubble = addBubble("Thinking…", "assistant");
  const response = await fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages }),
  });
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let answer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    answer += value;
    bubble.textContent = answer;
  }

  if (answer.startsWith("⚠")) {
    // Errors are shown but not kept in the conversation
    bubble.className = "error";
    messages.pop();
  } else {
    messages.push({ role: "assistant", content: answer });
  }
  question.disabled = askButton.disabled = false;
  question.focus();
};
</script>
</body>
</html>
